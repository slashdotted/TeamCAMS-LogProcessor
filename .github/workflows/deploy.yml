name: CI/CD TeamCAMSLogProcessor
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: linux_gcc_64
          - os: windows-latest
            platform: windows
            arch: win64_mingw
          - os: macos-latest
            platform: macos
            arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 cmake ninja-build gcc g++ libgl1-mesa-dev libx11-xcb-dev libgtk-3-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libcups2 libfontconfig1 libdbus-1-3 libasound2

    - name: Setup Ninja
      run: |
        if [ "${{ matrix.platform }}" = "windows" ]; then choco install ninja -y; fi
        if [ "${{ matrix.platform }}" = "macos" ]; then brew install ninja; fi
        if [ "${{ matrix.platform }}" = "linux" ]; then sudo apt-get install -y ninja-build; fi
      shell: bash

    - name: Install Qt 6.10.0
      uses: jurplel/install-qt-action@v4
      env:
        PIP_BREAK_SYSTEM_PACKAGES: '1'
      with:
        version: '6.10.0'
        arch: ${{ matrix.arch }}
        cache: 'true'
        dir: '${{ github.workspace }}/Qt'
        tools: ${{ matrix.platform == 'windows' && 'tools_mingw1310' || '' }}

    - name: Setup CQtDeployer (linux)
      if: matrix.platform == 'linux'
      uses: QuasarApp/cqtdeployer-install-action@v1.0.0
   
    - name: Configure and Build (linux/mac)
      if: matrix.platform != 'windows'
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DWITH_GUI=ON
        cmake --build build --config Release

    - name: Configure and Build (windows MinGW)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        CLEAN_PATH=$(echo "$PATH" | sed 's/\\/\//g')
        CLEAN_PATH=$(echo "$CLEAN_PATH" | tr ':' '\n' | grep -ivE 'strawberry|llvm|c/mingw64|git/usr' | tr '\n' ':')
        QT_MINGW_BIN="${{ github.workspace }}/Qt/Qt/6.10.0/mingw_64/bin"
        export PATH="$QT_MINGW_BIN:$CLEAN_PATH"
        cmake -B build -S . -G "Ninja" \
              -DCMAKE_BUILD_TYPE=Release \
              -DWITH_GUI=ON 
              
        cmake --build build --config Release

    - name: Main Install into Staging Folder (windows)
      if: matrix.platform == 'windows'
      run: |
        cmake --install build --prefix ${{ github.workspace }}/staging

    - name: Main Install into Staging Folder (linux)
      if: matrix.platform == 'linux'
      run: |
          export PATH=${{ github.workspace }}/Qt/Qt/6.10.0/gcc_64/bin:$PATH
          rm -rf ${{ github.workspace }}/staging
          cmake --install build --prefix ${{ github.workspace }}/staging          
          
    - name: Main Install into Staging Folder (macOS)
      if: matrix.platform == 'macos'
      run: |
        export PATH=${{ github.workspace }}/Qt/Qt/6.10.0/macos/bin:$PATH
        rm -rf ${{ github.workspace }}/staging
        cmake --install build --prefix ${{ github.workspace }}/staging          

    - name: Deploy Windows
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/staging-deployed/TeamCAMSLogProcessor-Windows"
        cp -r "${GITHUB_WORKSPACE}/staging/"* "${GITHUB_WORKSPACE}/staging-deployed/TeamCAMSLogProcessor-Windows/"
        "${GITHUB_WORKSPACE}/Qt/Qt/6.10.0/mingw_64/bin/windeployqt.exe" --release --qmldir "${GITHUB_WORKSPACE}/src" "${GITHUB_WORKSPACE}/staging-deployed/TeamCAMSLogProcessor-Windows/bin/TeamCAMSLogProcessor.exe"
        choco install openssl -y --no-progress
        cp /c/Program\ Files/OpenSSL/bin/libcrypto-*.dll "${GITHUB_WORKSPACE}/staging-deployed/TeamCAMSLogProcessor-Windows/bin/"
        cp /c/Program\ Files/OpenSSL/bin/libssl-*.dll "${GITHUB_WORKSPACE}/staging-deployed/TeamCAMSLogProcessor-Windows/bin/"        

    - name: Deploy Linux
      if: matrix.platform == 'linux'
      run: |
        export PATH=${{ github.workspace }}/Qt/Qt/6.10.0/gcc_64/bin:$PATH
        mkdir -p ${{ github.workspace }}/staging-deployed
        cqtdeployer -bin ${{ github.workspace }}/staging/bin/TeamCAMSLogProcessor \
                    -qmake qmake \
                    -qmlDir ${{ github.workspace }}/src \
                    -no-plugins sqldrivers \
                    -targetDir ${{ github.workspace }}/staging-deployed/TeamCAMSLogProcessor-Linux \
                    clear
        cd ${{ github.workspace }}/staging-deployed
        tar -czf TeamCAMSLogProcessor-Linux.tar.gz TeamCAMSLogProcessor-Linux/
        rm -rf TeamCAMSLogProcessor-Linux/

    - name: Deploy macOS
      if: matrix.platform == 'macos'
      run: |
        export PATH=${{ github.workspace }}/Qt/Qt/6.10.0/macos/bin:$PATH
        mkdir -p ${{ github.workspace }}/staging-deployed
        if [ -d "${{ github.workspace }}/staging/bin/TeamCAMSLogProcessor.app" ]; then
          mv ${{ github.workspace }}/staging/bin/TeamCAMSLogProcessor.app ${{ github.workspace }}/staging/
        fi
        macdeployqt ${{ github.workspace }}/staging/TeamCAMSLogProcessor.app -dmg
        mv ${{ github.workspace }}/staging/TeamCAMSLogProcessor.dmg ${{ github.workspace }}/staging-deployed/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeamCAMSLogProcessor-${{ matrix.platform }}
        path: staging-deployed/
